name: Release

# Pushing a tag `vX.Y.Z` tests the code, stages it on npm, and creates the
# GitHub release. npm is reached by trusted publishing (OpenID Connect): the
# package on npmjs.com names this repository and this workflow file as its
# trusted publisher, so no npm token is stored anywhere.
#
# The trusted publisher holds the "npm stage publish" permission only, so the
# version is staged, not public: a maintainer approves it with two-factor
# authentication (on npmjs.com, or `npm stage list` and `npm stage approve
# <stage-id>`), and only then can it be installed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      # Trusted publishing and staging need a recent npm.
      - run: npm install --global npm@latest
      - name: The package manifest needs no correction by npm
        run: |
          npm publish --dry-run 2>&1 | tee publish-check.log
          ! grep -q "auto-corrected" publish-check.log
      - run: npm stage publish --access public
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
