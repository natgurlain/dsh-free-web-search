name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin has no dependencies; the tests mock the network and Grok Build.
      - run: npm test
      - name: The package contains what it should, and npm accepts its manifest as written
        run: |
          npm install --global npm@latest
          npm publish --dry-run 2>&1 | tee publish-check.log
          ! grep -q "auto-corrected" publish-check.log
